services:
  grafana:
    image: grafana/grafana:latest
    container_name: minecom-grafana
    ports:
      - "3000:3000"
    # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD et GRAFANA_DB_PASSWORD
    # (utilisé par le provisioning de la source de données) viennent de .env.grafana.
    env_file:
      - .env.grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # PostgreSQL tourne sur Windows (port 5433) : Docker Desktop résout
    # nativement host.docker.internal vers l'hôte, pas besoin d'extra_hosts.

volumes:
  grafana-data:
