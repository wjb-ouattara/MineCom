services:
  grafana:
    image: grafana/grafana:latest
    container_name: minecom-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    # PostgreSQL tourne sur Windows (port 5433) : Docker Desktop résout
    # nativement host.docker.internal vers l'hôte, pas besoin d'extra_hosts.

volumes:
  grafana-data: