services:
  postgres:
    image: postgres:16
    container_name: minecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minecom
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Stockage des images/PDF (S3-compatible). Console web : http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: minecom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
